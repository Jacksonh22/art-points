<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Points Studio Ed</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --panel: #ffffff;
      --text: #2c3e50;
      --primary: #4a90e2;
      --accent: #f39c12;
      --danger: #e74c3c;
      --success: #2ecc71;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    .container { max-width: 1200px; margin: 0 auto; }

    header {
      background: var(--panel);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .title-area h1 { font-size: 1.8rem; color: var(--primary); display: flex; align-items: center; gap: 10px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    select, button, input {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      outline: none;
    }

    select { background: #fff; cursor: pointer; font-weight: 600; }

    button {
      background: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button.secondary { background: #7f8c8d; }
    button.success { background: var(--success); }
    button.warning { background: var(--accent); }
    button.danger { background: var(--danger); }

    .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--bg);
    }

    .rubric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 15px; }
    .rubric-btn {
      padding: 12px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 4px;
    }
    .rubric-btn.active { border-color: var(--success); background: #e8f8f0; color: var(--success); }
    .rubric-btn span { font-size: 0.75rem; opacity: 0.8; }

    .tables-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
    .table-box { border: 2px solid var(--border); border-radius: var(--radius); padding: 12px; background: #fff; }
    .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; }

    .student-list { display: flex; flex-direction: column; gap: 8px; }
    .student-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      background: #f8fafc;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .student-card.absent { opacity: 0.5; background: #eee; text-decoration: line-through; }
    .student-info { display: flex; align-items: center; gap: 8px; }
    .seat-num { background: #e2e8f0; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal { background: #fff; padding: 25px; border-radius: var(--radius); width: 100%; max-width: 500px; box-shadow: var(--shadow); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .modal textarea { width: 100%; height: 120px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 15px; }

    .cloud-status { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; padding: 4px 10px; border-radius: 20px; background: #e2e8f0; }
    .cloud-status.synced { background: #e8f8f0; color: var(--success); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="title-area">
      <h1>🎨 Art Points Studio Ed</h1>
      <div id="cloudBadge" class="cloud-status">☁️ Local Storage</div>
    </div>
    <div class="controls">
      <select id="classSelect" onchange="switchClass()"></select>
      <button class="success" onclick="openModal('classModal')">➕ Class</button>
      <button class="warning" onclick="openModal('bulkModal')">📋 Bulk Import</button>
      <button class="secondary" onclick="openModal('settingsModal')">⚙️ Settings & Sync</button>
    </div>
  </header>

  <div class="main-grid">
    <div class="left-col">
      <div class="card">
        <div class="card-header">
          <h2 id="activeClassName">Select a Class</h2>
          <div>
            <button class="secondary" onclick="editCurrentClass()">✏️ Edit Class</button>
            <button class="danger" onclick="deleteCurrentClass()">🗑️ Delete Class</button>
          </div>
        </div>

        <div class="tables-container" id="tablesGrid"></div>
      </div>
    </div>

    <div class="right-col">
      <div class="card">
        <div class="card-header">
          <h3>📋 Daily 5-Step Rubric</h3>
          <span id="rubricScore" style="font-weight: bold; color: var(--primary);">0/5</span>
        </div>
        <div class="rubric-grid">
          <button class="rubric-btn" onclick="toggleRubric(0)">
            <strong>Enter & Warmup</strong>
            <span>Step 1</span>
          </button>
          <button class="rubric-btn" onclick="toggleRubric(1)">
            <strong>Instruction</strong>
            <span>Step 2</span>
          </button>
          <button class="rubric-btn" onclick="toggleRubric(2)">
            <strong>Studio Time</strong>
            <span>Step 3</span>
          </button>
          <button class="rubric-btn" onclick="toggleRubric(3)">
            <strong>Clean Up</strong>
            <span>Step 4</span>
          </button>
          <button class="rubric-btn" onclick="toggleRubric(4)">
            <strong>Line Up</strong>
            <span>Step 5</span>
          </button>
        </div>
        <button class="success" style="width: 100%; justify-content: center;" onclick="awardClassPoint()">⭐ Award Class Rubric Point</button>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>🏆 Artist of the Day</h3>
        </div>
        <button class="warning" style="width: 100%; justify-content: center; padding: 12px;" onclick="pickRandomArtist()">🎲 Pick Random Present Student</button>
        <div id="artistWinner" style="margin-top: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; color: var(--accent);"></div>
      </div>
    </div>
  </div>
</div>

<!-- Bulk Import Modal -->
<div class="modal-overlay" id="bulkModal">
  <div class="modal">
    <div class="modal-header">
      <h3>📋 Bulk Add Roster</h3>
      <button class="secondary" onclick="closeModal('bulkModal')">✖</button>
    </div>
    <p style="font-size: 0.85rem; color: #666; margin-bottom: 10px;">Paste student names separated by commas or lines:</p>
    <textarea id="bulkInput" placeholder="Alice Smith&#10;Bob Jones&#10;Charlie Brown"></textarea>
    <div style="display: flex; gap: 10px; justify-content: flex-end;">
      <button class="secondary" onclick="closeModal('bulkModal')">Cancel</button>
      <button class="success" onclick="processBulkImport()">Import Students</button>
    </div>
  </div>
</div>

<!-- Class Modal -->
<div class="modal-overlay" id="classModal">
  <div class="modal">
    <div class="modal-header">
      <h3>➕ Create New Class</h3>
      <button class="secondary" onclick="closeModal('classModal')">✖</button>
    </div>
    <input type="text" id="newClassName" placeholder="e.g. Yellow-3rd Grider" style="width: 100%; margin-bottom: 15px;">
    <div style="display: flex; gap: 10px; justify-content: flex-end;">
      <button class="secondary" onclick="closeModal('classModal')">Cancel</button>
      <button class="success" onclick="addClass()">Create Class</button>
    </div>
  </div>
</div>

<!-- Settings & Google Sheets Sync Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h3>⚙️ Settings & Google Sheets Sync</h3>
      <button class="secondary" onclick="closeModal('settingsModal')">✖</button>
    </div>
    <p style="font-size: 0.85rem; color: #666; margin-bottom: 8px;"><strong>Google Apps Script Web App URL:</strong></p>
    <input type="text" id="sheetsUrl" placeholder="https://script.google.com/macros/s/.../exec" style="width: 100%; margin-bottom: 15px;">
    
    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;">
      <button class="primary" onclick="syncToGoogleSheets()">📤 Save / Backup to Google Sheets</button>
      <button class="warning" onclick="pullFromGoogleSheets()">📥 Restore from Google Sheets</button>
    </div>
    <hr style="margin-bottom: 15px; border: 0; border-top: 1px solid var(--border);">
    <div style="display: flex; gap: 10px; justify-content: space-between;">
      <button class="secondary" onclick="exportJSON()">💾 Export JSON</button>
      <button class="secondary" onclick="importJSON()">📂 Import JSON</button>
    </div>
  </div>
</div>

<script>
  let appData = {
    classes: {},
    activeClass: null,
    sheetsUrl: ""
  };

  const STORAGE_KEYS = ['artRoomData', 'seatingChartData', 'appData'];

  function init() {
    loadData();
    renderClassDropdown();
    if (appData.activeClass && appData.classes[appData.activeClass]) {
      renderActiveClass();
    }
  }

  function loadData() {
    let found = false;
    for (let key of STORAGE_KEYS) {
      let raw = localStorage.getItem(key);
      if (raw) {
        try {
          let parsed = JSON.parse(raw);
          if (parsed.classes && Object.keys(parsed.classes).length > 0) {
            appData = parsed;
            found = true;
            break;
          }
        } catch(e) {}
      }
    }

    if (!found || !appData.classes || Object.keys(appData.classes).length === 0) {
      // Default structure
      appData.classes = {
        "Sample Art Class": {
          tables: {
            "Table 1": [
              { name: "Alex", points: 0, absent: false, seat: 1 },
              { name: "Sam", points: 0, absent: false, seat: 2 }
            ]
          },
          rubric: [false, false, false, false, false]
        }
      };
      appData.activeClass = "Sample Art Class";
    }

    if (!appData.activeClass || !appData.classes[appData.activeClass]) {
      appData.activeClass = Object.keys(appData.classes)[0];
    }
    saveData();
  }

  function saveData() {
    let json = JSON.stringify(appData);
    for (let key of STORAGE_KEYS) {
      localStorage.setItem(key, json);
    }
    if (appData.sheetsUrl) {
      document.getElementById('cloudBadge').classList.add('synced');
      document.getElementById('cloudBadge').innerText = "☁️ Google Sheets Configured";
    }
  }

  function renderClassDropdown() {
    const sel = document.getElementById('classSelect');
    sel.innerHTML = '';
    for (let className in appData.classes) {
      let opt = document.createElement('option');
      opt.value = className;
      opt.innerText = className;
      if (className === appData.activeClass) opt.selected = true;
      sel.appendChild(opt);
    }
  }

  function switchClass() {
    appData.activeClass = document.getElementById('classSelect').value;
    saveData();
    renderActiveClass();
  }

  function renderActiveClass() {
    const current = appData.classes[appData.activeClass];
    document.getElementById('activeClassName').innerText = appData.activeClass;
    
    // Render Tables
    const container = document.getElementById('tablesGrid');
    container.innerHTML = '';

    if (!current.tables || Object.keys(current.tables).length === 0) {
      current.tables = { "Table 1": [], "Table 2": [], "Table 3": [], "Table 4": [] };
    }

    for (let tName in current.tables) {
      let tBox = document.createElement('div');
      tBox.className = 'table-box';
      
      let html = `<div class="table-header">
        <span>${tName}</span>
        <div>
          <button class="warning" style="padding: 2px 6px; font-size: 0.75rem;" onclick="addTablePoint('${tName}')">+1 Team</button>
          <button class="secondary" style="padding: 2px 6px; font-size: 0.75rem;" onclick="addStudentPrompt('${tName}')">+ Student</button>
        </div>
      </div><div class="student-list">`;

      current.tables[tName].forEach((s, idx) => {
        html += `<div class="student-card ${s.absent ? 'absent' : ''}">
          <div class="student-info">
            <span class="seat-num">${s.seat || idx + 1}</span>
            <span><strong>${s.name}</strong> (${s.points || 0} pts)</span>
          </div>
          <div>
            <button class="secondary" style="padding: 2px 6px; font-size: 0.7rem;" onclick="toggleAbsent('${tName}', ${idx})">${s.absent ? 'Present' : 'Absent'}</button>
            <button class="success" style="padding: 2px 6px; font-size: 0.7rem;" onclick="addPoint('${tName}', ${idx}, 1)">+1</button>
            <button class="danger" style="padding: 2px 6px; font-size: 0.7rem;" onclick="deleteStudent('${tName}', ${idx})">🗑️</button>
          </div>
        </div>`;
      });

      html += `</div>`;
      tBox.innerHTML = html;
      container.appendChild(tBox);
    }

    // Render Rubric
    if (!current.rubric) current.rubric = [false, false, false, false, false];
    let activeCount = 0;
    const btns = document.querySelectorAll('.rubric-btn');
    btns.forEach((btn, idx) => {
      if (current.rubric[idx]) {
        btn.classList.add('active');
        activeCount++;
      } else {
        btn.classList.remove('active');
      }
    });
    document.getElementById('rubricScore').innerText = `${activeCount}/5`;
  }

  function addPoint(tName, idx, pts) {
    let student = appData.classes[appData.activeClass].tables[tName][idx];
    if (student.absent) return;
    student.points = (student.points || 0) + pts;
    saveData();
    renderActiveClass();
  }

  function addTablePoint(tName) {
    let students = appData.classes[appData.activeClass].tables[tName];
    students.forEach(s => {
      if (!s.absent) s.points = (s.points || 0) + 1;
    });
    saveData();
    renderActiveClass();
  }

  function toggleAbsent(tName, idx) {
    let student = appData.classes[appData.activeClass].tables[tName][idx];
    student.absent = !student.absent;
    saveData();
    renderActiveClass();
  }

  function deleteStudent(tName, idx) {
    if (confirm("Remove student?")) {
      appData.classes[appData.activeClass].tables[tName].splice(idx, 1);
      saveData();
      renderActiveClass();
    }
  }

  function addStudentPrompt(tName) {
    let name = prompt("Student Name:");
    if (name) {
      appData.classes[appData.activeClass].tables[tName].push({
        name: name.trim(),
        points: 0,
        absent: false,
        seat: appData.classes[appData.activeClass].tables[tName].length + 1
      });
      saveData();
      renderActiveClass();
    }
  }

  function toggleRubric(idx) {
    let current = appData.classes[appData.activeClass];
    if (!current.rubric) current.rubric = [false, false, false, false, false];
    current.rubric[idx] = !current.rubric[idx];
    saveData();
    renderActiveClass();
  }

  function awardClassPoint() {
    let current = appData.classes[appData.activeClass];
    for (let t in current.tables) {
      current.tables[t].forEach(s => {
        if (!s.absent) s.points = (s.points || 0) + 1;
      });
    }
    saveData();
    renderActiveClass();
    alert("Point awarded to all present students!");
  }

  function pickRandomArtist() {
    let present = [];
    let current = appData.classes[appData.activeClass];
    for (let t in current.tables) {
      current.tables[t].forEach(s => {
        if (!s.absent) present.push(s.name);
      });
    }
    if (present.length === 0) {
      document.getElementById('artistWinner').innerText = "No present students found!";
      return;
    }
    let winner = present[Math.floor(Math.random() * present.length)];
    document.getElementById('artistWinner').innerText = `🎉 ${winner} 🎉`;
  }

  function processBulkImport() {
    let txt = document.getElementById('bulkInput').value;
    if (!txt.trim()) return;
    
    let names = txt.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
    let current = appData.classes[appData.activeClass];
    let tables = Object.keys(current.tables);
    if (tables.length === 0) {
      current.tables = { "Table 1": [], "Table 2": [], "Table 3": [], "Table 4": [] };
      tables = Object.keys(current.tables);
    }

    names.forEach((name, i) => {
      let targetTable = tables[i % tables.length];
      current.tables[targetTable].push({
        name: name,
        points: 0,
        absent: false,
        seat: current.tables[targetTable].length + 1
      });
    });

    saveData();
    renderActiveClass();
    closeModal('bulkModal');
    document.getElementById('bulkInput').value = '';
  }

  function addClass() {
    let name = document.getElementById('newClassName').value.trim();
    if (!name) return;
    appData.classes[name] = {
      tables: { "Table 1": [], "Table 2": [], "Table 3": [], "Table 4": [] },
      rubric: [false, false, false, false, false]
    };
    appData.activeClass = name;
    saveData();
    renderClassDropdown();
    renderActiveClass();
    closeModal('classModal');
    document.getElementById('newClassName').value = '';
  }

  function deleteCurrentClass() {
    if (confirm(`Delete class "${appData.activeClass}"?`)) {
      delete appData.classes[appData.activeClass];
      let keys = Object.keys(appData.classes);
      appData.activeClass = keys.length > 0 ? keys[0] : null;
      saveData();
      renderClassDropdown();
      renderActiveClass();
    }
  }

  function syncToGoogleSheets() {
    let url = document.getElementById('sheetsUrl').value.trim();
    if (!url) { alert("Please enter a Google Web App URL"); return; }
    appData.sheetsUrl = url;
    saveData();

    fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(appData)
    }).then(() => {
      alert("Sent backup to Google Sheets!");
    }).catch(e => alert("Error saving to Sheets: " + e));
  }

  function pullFromGoogleSheets() {
    let url = document.getElementById('sheetsUrl').value.trim();
    if (!url) { alert("Please enter a Google Web App URL"); return; }
    
    fetch(url)
      .then(res => res.json())
      .then(data => {
        if (data && data.classes) {
          appData = data;
          saveData();
          renderClassDropdown();
          renderActiveClass();
          alert("Successfully restored rosters from Google Sheets!");
        }
      })
      .catch(e => alert("Error loading from Sheets: " + e));
  }

  function openModal(id) { document.getElementById(id).style.display = 'flex'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  function exportJSON() {
    let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
    let dlAnchor = document.createElement('a');
    dlAnchor.setAttribute("href", dataStr);
    dlAnchor.setAttribute("download", "art_points_backup.json");
    dlAnchor.click();
  }
  function importJSON() {
    let raw = prompt("Paste your backup JSON text here:");
    if (raw) {
      try {
        let parsed = JSON.parse(raw);
        if (parsed.classes) {
          appData = parsed;
          saveData();
          renderClassDropdown();
          renderActiveClass();
          alert("Data restored!");
        }
      } catch(e) { alert("Invalid JSON"); }
    }
  }

  window.onload = init;
</script>
</body>
</html>
