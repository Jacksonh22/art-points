<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Points Studio Ed</title>
  <style>
    :root {
      --primary: #4a90e2;
      --primary-dark: #357abd;
      --accent: #f39c12;
      --danger: #e74c3c;
      --success: #2ecc71;
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; }
    .container { max-width: 1300px; margin: 0 auto; }

    header {
      background: var(--panel);
      padding: 20px 28px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-group h1 { font-size: 1.6rem; font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 10px; }
    .badge { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; background: #f1f5f9; color: #64748b; font-weight: 600; }
    .badge.synced { background: #dcfce7; color: #15803d; }

    .controls { display: flex; gap: 10px; align-items: center; }
    select, button, input {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
      transition: all 0.15s ease;
    }

    select { background: #fff; cursor: pointer; }
    button { background: var(--primary); color: white; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    button:hover { opacity: 0.92; transform: translateY(-1px); }
    button.secondary { background: #64748b; }
    button.success { background: var(--success); }
    button.warning { background: var(--accent); }
    button.danger { background: var(--danger); }

    .grid { display: grid; grid-template-columns: 2.2fr 1fr; gap: 24px; }

    .card {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .tables-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    .table-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      background: #fafafa;
    }

    .table-title { font-weight: 700; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }

    .student-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #fff;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .student-card.absent { opacity: 0.4; text-decoration: line-through; }
    .seat { background: #f1f5f9; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; margin-right: 8px; }

    .rubric-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .rubric-item {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .rubric-item.active { background: #dcfce7; border-color: #86efac; color: #166534; font-weight: 700; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal { background: #fff; padding: 28px; border-radius: var(--radius); width: 100%; max-width: 460px; box-shadow: var(--shadow); }
    .modal h3 { margin-bottom: 16px; }
    .modal textarea { width: 100%; height: 120px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 16px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="title-group">
      <h1>🎨 Art Points Studio Ed</h1>
      <span id="cloudBadge" class="badge">Local Storage</span>
    </div>
    <div class="controls">
      <select id="classSelect" onchange="switchClass()"></select>
      <button class="success" onclick="openModal('classModal')">➕ Class</button>
      <button class="warning" onclick="openModal('bulkModal')">📋 Bulk Import</button>
      <button class="secondary" onclick="openModal('settingsModal')">⚙️ Settings</button>
    </div>
  </header>

  <div class="grid">
    <div>
      <div class="card">
        <div class="card-header">
          <h2 id="activeClassName">Class View</h2>
          <div>
            <button class="danger" onclick="deleteCurrentClass()">Delete Class</button>
          </div>
        </div>
        <div class="tables-grid" id="tablesGrid"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="card-header">
          <h3>Daily Rubric</h3>
          <span id="rubricScore" style="font-weight: 800; color: var(--primary);">0/5</span>
        </div>
        <div class="rubric-list">
          <div class="rubric-item" onclick="toggleRubric(0)">1. Enter & Warmup <span>✓</span></div>
          <div class="rubric-item" onclick="toggleRubric(1)">2. Instruction <span>✓</span></div>
          <div class="rubric-item" onclick="toggleRubric(2)">3. Studio Time <span>✓</span></div>
          <div class="rubric-item" onclick="toggleRubric(3)">4. Clean Up <span>✓</span></div>
          <div class="rubric-item" onclick="toggleRubric(4)">5. Line Up <span>✓</span></div>
        </div>
        <button class="success" style="width: 100%; justify-content: center;" onclick="awardClassPoint()">⭐ Award Class Point</button>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Artist of the Day</h3>
        </div>
        <button class="warning" style="width: 100%; justify-content: center;" onclick="pickRandomArtist()">🎲 Pick Present Student</button>
        <div id="artistWinner" style="margin-top: 16px; text-align: center; font-size: 1.2rem; font-weight: 800; color: var(--accent);"></div>
      </div>
    </div>
  </div>
</div>

<!-- Bulk Import Modal -->
<div class="modal-overlay" id="bulkModal">
  <div class="modal">
    <h3>📋 Bulk Add Roster</h3>
    <textarea id="bulkInput" placeholder="Paste student names (comma or line separated)..."></textarea>
    <div style="display: flex; gap: 10px; justify-content: flex-end;">
      <button class="secondary" onclick="closeModal('bulkModal')">Cancel</button>
      <button class="success" onclick="processBulkImport()">Import</button>
    </div>
  </div>
</div>

<!-- Class Modal -->
<div class="modal-overlay" id="classModal">
  <div class="modal">
    <h3>➕ Create Class</h3>
    <input type="text" id="newClassName" placeholder="e.g. Yellow-3rd Grade" style="width: 100%; margin-bottom: 16px;">
    <div style="display: flex; gap: 10px; justify-content: flex-end;">
      <button class="secondary" onclick="closeModal('classModal')">Cancel</button>
      <button class="success" onclick="addClass()">Create</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>⚙️ Google Sheets Sync</h3>
    <input type="text" id="sheetsUrl" placeholder="Paste Google Web App URL here..." style="width: 100%; margin-bottom: 16px;">
    <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;">
      <button class="primary" onclick="syncToGoogleSheets()">📤 Save to Google Sheets</button>
      <button class="warning" onclick="pullFromGoogleSheets()">📥 Load from Google Sheets</button>
    </div>
    <div style="display: flex; gap: 10px; justify-content: space-between;">
      <button class="secondary" onclick="exportJSON()">💾 Export Backup</button>
      <button class="secondary" onclick="importJSON()">📂 Import Backup</button>
    </div>
  </div>
</div>

<script>
  let appData = { classes: {}, activeClass: null, sheetsUrl: "" };
  const KEYS = ['artRoomData', 'seatingChartData', 'appData'];

  function init() {
    loadData();
    renderDropdown();
    if (appData.activeClass && appData.classes[appData.activeClass]) renderClass();
  }

  function loadData() {
    for (let k of KEYS) {
      let raw = localStorage.getItem(k);
      if (raw) {
        try {
          let p = JSON.parse(raw);
          if (p.classes && Object.keys(p.classes).length > 0) { appData = p; break; }
        } catch(e) {}
      }
    }
    if (!appData.activeClass && Object.keys(appData.classes).length > 0) {
      appData.activeClass = Object.keys(appData.classes)[0];
    }
    saveData();
  }

  function saveData() {
    let json = JSON.stringify(appData);
    KEYS.forEach(k => localStorage.setItem(k, json));
    if (appData.sheetsUrl) {
      document.getElementById('cloudBadge').className = 'badge synced';
      document.getElementById('cloudBadge').innerText = 'Cloud Sync Active';
    }
  }

  function renderDropdown() {
    const sel = document.getElementById('classSelect');
    sel.innerHTML = '';
    for (let c in appData.classes) {
      let opt = document.createElement('option');
      opt.value = c; opt.innerText = c;
      if (c === appData.activeClass) opt.selected = true;
      sel.appendChild(opt);
    }
  }

  function switchClass() {
    appData.activeClass = document.getElementById('classSelect').value;
    saveData();
    renderClass();
  }

  function renderClass() {
    const cur = appData.classes[appData.activeClass];
    document.getElementById('activeClassName').innerText = appData.activeClass;
    const grid = document.getElementById('tablesGrid');
    grid.innerHTML = '';

    if (!cur.tables) cur.tables = { "Table 1": [], "Table 2": [] };

    for (let t in cur.tables) {
      let box = document.createElement('div');
      box.className = 'table-box';
      let html = `<div class="table-title"><span>${t}</span><div>
        <button class="warning" style="padding: 2px 8px; font-size: 0.75rem;" onclick="addTablePoint('${t}')">+1 All</button>
        <button class="secondary" style="padding: 2px 8px; font-size: 0.75rem;" onclick="addStudentPrompt('${t}')">+</button>
      </div></div>`;

      cur.tables[t].forEach((s, i) => {
        html += `<div class="student-card ${s.absent ? 'absent' : ''}">
          <div style="display:flex; align-items:center;">
            <span class="seat">${s.seat || i+1}</span>
            <span><strong>${s.name}</strong> (${s.points || 0})</span>
          </div>
          <div>
            <button class="secondary" style="padding: 2px 6px; font-size: 0.7rem;" onclick="toggleAbsent('${t}', ${i})">${s.absent ? 'P' : 'A'}</button>
            <button class="success" style="padding: 2px 6px; font-size: 0.7rem;" onclick="addPoint('${t}', ${i}, 1)">+1</button>
            <button class="danger" style="padding: 2px 6px; font-size: 0.7rem;" onclick="deleteStudent('${t}', ${i})">×</button>
          </div>
        </div>`;
      });
      box.innerHTML = html;
      grid.appendChild(box);
    }

    if (!cur.rubric) cur.rubric = [false, false, false, false, false];
    let cnt = 0;
    document.querySelectorAll('.rubric-item').forEach((item, i) => {
      if (cur.rubric[i]) { item.classList.add('active'); cnt++; }
      else item.classList.remove('active');
    });
    document.getElementById('rubricScore').innerText = `${cnt}/5`;
  }

  function addPoint(t, i, p) {
    let s = appData.classes[appData.activeClass].tables[t][i];
    if (!s.absent) s.points = (s.points || 0) + p;
    saveData(); renderClass();
  }

  function addTablePoint(t) {
    appData.classes[appData.activeClass].tables[t].forEach(s => { if (!s.absent) s.points = (s.points || 0) + 1; });
    saveData(); renderClass();
  }

  function toggleAbsent(t, i) {
    let s = appData.classes[appData.activeClass].tables[t][i];
    s.absent = !s.absent;
    saveData(); renderClass();
  }

  function deleteStudent(t, i) {
    appData.classes[appData.activeClass].tables[t].splice(i, 1);
    saveData(); renderClass();
  }

  function addStudentPrompt(t) {
    let n = prompt("Student Name:");
    if (n) {
      appData.classes[appData.activeClass].tables[t].push({ name: n.trim(), points: 0, absent: false });
      saveData(); renderClass();
    }
  }

  function toggleRubric(i) {
    let cur = appData.classes[appData.activeClass];
    if (!cur.rubric) cur.rubric = [false, false, false, false, false];
    cur.rubric[i] = !cur.rubric[i];
    saveData(); renderClass();
  }

  function awardClassPoint() {
    let cur = appData.classes[appData.activeClass];
    for (let t in cur.tables) cur.tables[t].forEach(s => { if (!s.absent) s.points = (s.points || 0) + 1; });
    saveData(); renderClass();
  }

  function pickRandomArtist() {
    let list = [];
    let cur = appData.classes[appData.activeClass];
    for (let t in cur.tables) cur.tables[t].forEach(s => { if (!s.absent) list.push(s.name); });
    document.getElementById('artistWinner').innerText = list.length ? `🎉 ${list[Math.floor(Math.random() * list.length)]} 🎉` : "No present students";
  }

  function processBulkImport() {
    let txt = document.getElementById('bulkInput').value;
    if (!txt.trim()) return;
    let names = txt.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length);
    let cur = appData.classes[appData.activeClass];
    let tables = Object.keys(cur.tables);
    if (!tables.length) { cur.tables = { "Table 1": [], "Table 2": [] }; tables = Object.keys(cur.tables); }

    names.forEach((name, i) => {
      let target = tables[i % tables.length];
      cur.tables[target].push({ name: name, points: 0, absent: false });
    });

    saveData(); renderClass(); closeModal('bulkModal');
  }

  function addClass() {
    let name = document.getElementById('newClassName').value.trim();
    if (!name) return;
    appData.classes[name] = { tables: { "Table 1": [], "Table 2": [] }, rubric: [false, false, false, false, false] };
    appData.activeClass = name;
    saveData(); renderDropdown(); renderClass(); closeModal('classModal');
  }

  function deleteCurrentClass() {
    if (confirm(`Delete ${appData.activeClass}?`)) {
      delete appData.classes[appData.activeClass];
      let keys = Object.keys(appData.classes);
      appData.activeClass = keys.length ? keys[0] : null;
      saveData(); renderDropdown(); renderClass();
    }
  }

  function syncToGoogleSheets() {
    let url = document.getElementById('sheetsUrl').value.trim();
    if (!url) return;
    appData.sheetsUrl = url;
    saveData();
    fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(appData) });
  }

  function pullFromGoogleSheets() {
    let url = document.getElementById('sheetsUrl').value.trim();
    if (!url) return;
    fetch(url).then(r => r.json()).then(d => {
      if (d && d.classes) { appData = d; saveData(); renderDropdown(); renderClass(); alert("Restored!"); }
    });
  }

  function openModal(id) { document.getElementById(id).style.display = 'flex'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  function exportJSON() {
    let blob = new Blob([JSON.stringify(appData)], {type: 'application/json'});
    let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'art_points_backup.json'; a.click();
  }
  function importJSON() {
    let raw = prompt("Paste backup text:");
    if (raw) { try { appData = JSON.parse(raw); saveData(); renderDropdown(); renderClass(); } catch(e){} }
  }

  window.onload = init;
</script>
</body>
</html>
